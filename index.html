<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Links — Instagram, Facebook, and Email" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Theme Toggle ── -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">

        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <!-- Moon icon (shown in light mode) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" />

  </button>

        Replace "logo/logo.png" with the path to your image file inside the /logo folder.
        Example: <img src="logo/mylogo.jpg" alt="Logo" class="logo-img" />
      -->
      <img src="logo/dna.png" alt="Logo" class="logo-img"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />

      <div class="logo-placeholder" style="display:none;" aria-hidden="true">◆</div>
    </div>

    <!-- Name & Bio -->
    <h1 class="profile-name">David Natan Apruebo</h1>
    <p class="profile-bio">Tech probs? I got you! Message me here on any of the socials below</p>

    <!-- Links -->
    <nav class="links-wrapper" aria-label="Social links">

      <!-- Instagram -->
      <a href="https://www.instagram.com/dabidism/" target="_blank" rel="noopener noreferrer" class="link-btn"
        id="link-instagram" aria-label="Visit Instagram profile">

          <div class="link-label-title">Instagram</div>

          </svg>
        </div>
        <div class="link-label">
          <div class="link-label-title">Facebook</div>
          <div class="link-label-sub">david.natan.apruebo.75</div>
        </div>
        <svg class="link-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <svg class="link-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"

      <!-- Phone — display only, not clickable -->
      <div class="link-btn link-btn--static" id="link-phone" aria-label="Phone number">
        <div class="link-icon" aria-hidden="true">
          <!-- Phone SVG -->

    </nav>

    <div class="divider" role="separator"></div>

    <p class="footer">© 2026 Dabidism</p>

  </main>

  <script>
    // ── Theme Toggle Logic ──
    const html = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      // Show sun in dark mode (click → go light), moon in light mode (click → go dark)
      toggleBtn.classList.toggle('is-dark', theme === 'dark');
    }

    // Persist theme in localStorage, default to dark
    const saved = localStorage.getItem('theme') || 'dark';
    applyTheme(saved);

    toggleBtn.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });
  </script>

</body>

</html>
